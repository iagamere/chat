name: Android debug build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Unit tests
        run: mkdir -p logs && gradle --no-daemon testDebugUnitTest 2>&1 | tee logs/test.log
        shell: bash
      - name: Lint (informational)
        continue-on-error: true
        run: gradle --no-daemon lintDebug 2>&1 | tee logs/lint.log
        shell: bash
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug 2>&1 | tee logs/assemble.log; test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - name: Verify and rename APK
        run: |
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$apk" && test "$(stat -c%s "$apk")" -gt 1000000 || { echo "APK missing or too small"; exit 1; }
          cp "$apk" PS4Monitor-debug.apk
      - uses: actions/upload-artifact@v4
        with: { name: PS4Monitor-debug.apk, path: PS4Monitor-debug.apk, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-logs, path: logs, if-no-files-found: warn }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            app/build/test-results
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
